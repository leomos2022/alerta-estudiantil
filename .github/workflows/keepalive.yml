name: Keep API Alive

on:
  schedule:
    # Cada 10 minutos (evita que Render duerma)
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://alerta-estudiantil-api.onrender.com/health)
          echo "API status: $response"
          if [ "$response" != "200" ]; then
            echo "API not responding, retrying..."
            sleep 30
            curl -s -o /dev/null https://alerta-estudiantil-api.onrender.com/health
          fi
